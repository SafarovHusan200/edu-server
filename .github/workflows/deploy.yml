name: Deploy # Actions bo'limida ko'rinadigan nom

on:
  push:
    branches:
      - main # faqat main branchga push bo'lganda ishga tushadi

jobs:
  deploy:
    runs-on: ubuntu-latest # GitHub'ning vaqtinchalik virtual mashinasi

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3 # tayyor SSH-orqali-buyruq-yuborish action
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Bu qatorlar serverda, SSH ichida ishga tushadi:

            export NVM_DIR="/root/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            # ^ nvm'ni yuklaydi, chunki SSH orqali kirilganda .bashrc
            #   avtomatik ishlamaydi, shuning uchun node/npm topilmay qolishi mumkin

            export PATH="/root/.nvm/versions/node/v22.20.0/bin:$PATH"
            # ^ aniq Node v22.20.0 versiyasini PATH'ga qo'shadi (xavfsizroq yo'l)

            cd /root/edu-server/
            git fetch origin main       # yangi commit'larni yuklaydi
            git reset --hard origin/main
            # ^ serverdagi lokal o'zgarishlarni bekor qilib, GitHub'dagi
            #   holatga to'liq moslashtiradi (masalan, kimdir qo'lda
            #   serverda fayl o'zgartirgan bo'lsa ham, ular yo'qoladi)

            npm install                 # yangi/o'zgargan paketlarni o'rnatadi
            pm2 restart edu-server      # ilovani qayta ishga tushiradi
